[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor-agent"
version = "0.1.0"
description = "Bounded, evidence-aware textbook agent prototype for AI Tutor"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "uvicorn==0.46.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-asyncio==1.4.0"]

[project.scripts]
tutor-agent-demo = "tutor_agent.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tutor_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
