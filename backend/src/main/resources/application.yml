server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-tutor-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_tutor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.aitutor.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-ai-tutor-jwt-secret-change-me}
    issuer: ${JWT_ISSUER:ai-tutor}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model-name: ${DEEPSEEK_MODEL_NAME:deepseek-v4-flash}
    timeout-ms: ${DEEPSEEK_TIMEOUT_MS:60000}
    max-context-messages: ${AI_MAX_CONTEXT_MESSAGES:10}
